name: Publish
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  publish:
    name: Publish (crates.io)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Check release version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Expected a tag in the form vX.Y.Z: $GITHUB_REF_NAME" >&2
              exit 1
          fi

          package_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "hexlab") | .version')
          if [[ "v$package_version" != "$GITHUB_REF_NAME" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $package_version" >&2
              exit 1
          fi
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
        run: cargo publish --locked --all-features
